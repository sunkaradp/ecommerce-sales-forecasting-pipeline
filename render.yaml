services:
  - type: web
    name: ecommerce-dashboard
    env: python
    buildCommand: cd flask-dashboard && pip install -r requirements.txt
    startCommand: cd flask-dashboard && gunicorn app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 4500
      - key: MONGO_URI
        sync: false
    autoDeploy: true
